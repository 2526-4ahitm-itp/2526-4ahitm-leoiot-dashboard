server {
    listen 80;
    server_name vm23.htl-leonding.ac.at;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vm23.htl-leonding.ac.at;

    ssl_certificate /etc/letsencrypt/live/vm23.htl-leonding.ac.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm23.htl-leonding.ac.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 1. Grafana Proxy (JETZT MIT PROTO-HEADER)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # <--- DAS IST DER FIX!
    }

    location = /kiosk      { return 301 /kiosk/; }
    location = /dashboard  { return 301 /dashboard/; }

    # Former kiosk addresses lead to the main kiosk. Permanent since the old
    # kiosks were removed from legacy/.
    location = /leogreen   { return 301 /kiosk/$is_args$args; }
    location /leogreen/    { return 301 /kiosk/$is_args$args; }
    location = /kiosk2     { return 301 /kiosk/$is_args$args; }
    location /kiosk2/      { return 301 /kiosk/$is_args$args; }
    location = /kiosk3     { return 301 /kiosk/$is_args$args; }
    location /kiosk3/      { return 301 /kiosk/$is_args$args; }
    location = /kiosk4     { return 301 /kiosk/$is_args$args; }
    location /kiosk4/      { return 301 /kiosk/$is_args$args; }

    # Main kiosk of leoiot-pv (leoiot-pv/compose.yaml)
    location = /kiosk/ws {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /kiosk/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
    }

    # PV dashboard of leoiot-pv (leoiot-pv/compose.yaml, service dashboard)
    location = /pv/ws {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /pv/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
    }

    location /dashboard/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
    }

    location /influx/ {
        proxy_pass http://127.0.0.1:8086/;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /solax/ {
        proxy_pass https://openapi-eu.solaxcloud.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host openapi-eu.solaxcloud.com;
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
