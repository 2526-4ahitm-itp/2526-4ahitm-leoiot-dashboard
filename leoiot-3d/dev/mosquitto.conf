# Development broker of compose.dev.yaml. Local testing only, never deployed.
# Unlike the platform broker it lets anyone publish, so that the development
# publisher (explorer/dev/publish.mjs) can send simulated readings.

persistence true
persistence_location /mosquitto/data/

# MQTT for the development publisher and mosquitto_pub / mosquitto_sub
listener 1883
# MQTT over WebSocket, reached by the browser through /mqtt
listener 9001
protocol websockets

allow_anonymous true
