# Development stand-in for the vm23 nginx (compose.dev.yaml), limited to what
# the explorer uses: /3d/ to the explorer with the prefix kept, as
# docs/continuations/platform-3d-route.md plans it, and /mqtt to the broker's
# WebSocket listener. Local testing only, never deployed.

server {
    listen 80;
    server_name _;
    # Relative redirects, so they keep the published port (default 8000)
    absolute_redirect off;

    location = /3d {
        return 301 /3d/$is_args$args;
    }

    location /3d/ {
        proxy_pass http://explorer:8091;
        proxy_set_header Host $host;
    }

    location = /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
