# nginx in the explorer container. Serves the build under /3d/ (the host nginx
# keeps the prefix when it forwards /3d/ to 127.0.0.1:8091).

server {
    listen 8091;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;

    # mime.types has no entry for glTF; a types block here replaces the
    # inherited one, so the standard list is included again first
    include /etc/nginx/mime.types;
    types {
        model/gltf+json gltf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /3d {
        return 301 /3d/;
    }

    # Files with a content hash in their name, including the models: cached for
    # good, and served from the .gz copy written at build time where it exists
    location /3d/assets/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself is always fetched again, so that a deploy arrives
    location /3d/ {
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
