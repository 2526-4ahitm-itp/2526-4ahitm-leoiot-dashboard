<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Räume · LeoIoT Raumklima</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
// Keeps the saved theme and language from flashing; the page's own code reads the same keys.
try {
  var theme = localStorage.getItem('leoiot-sensors.theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  if (localStorage.getItem('leoiot-sensors.lang') === 'en') document.documentElement.lang = 'en';
} catch (e) {}
</script>
</head>
<body>
<header class="bar">
  <div class="brand"><span id="brand">LeoIoT</span> <span id="brandSub">Raumklima</span></div>
  <nav class="crumb" id="crumb" aria-label="Raumauswahl">
    <a id="allRooms" href="./">Alle Räume</a>
    <select class="ctl" id="roomSelect" aria-label="Raum wählen"></select>
  </nav>
  <div class="ctl seg" role="group" id="rangeGroup" aria-label="Zeitraum">
    <button type="button" data-range="24h" aria-pressed="true">24 h</button>
    <button type="button" data-range="7d" aria-pressed="false">7 Tage</button>
  </div>
  <div class="spacer"></div>
  <div class="ctl seg" role="group" id="langGroup" aria-label="Sprache">
    <button type="button" data-lang="de" lang="de" aria-pressed="true">DE</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
  </div>
  <button type="button" class="ctl icon-btn" id="theme" aria-label="Dunkles Design einschalten">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
  </button>
</header>

<main id="app" data-view="room" data-state="loading" data-air="off" data-fresh="live" data-source="sensor">
  <section class="room" id="roomPanel">
    <div class="identity">
      <h1 class="room-id"><span id="roomWord">Raum </span><span id="roomId">105</span></h1>
      <a class="link3d" id="link3d" href="/3d/" hidden>Im Gebäude zeigen</a>
      <span class="tag" id="simTag" hidden>simuliert</span>
    </div>
    <div class="light" role="img" id="light" aria-label="Ampel aus">
      <div class="lamp r"></div><div class="lamp y"></div><div class="lamp g"></div>
    </div>
    <div class="state">
      <div aria-live="polite" aria-atomic="true">
        <p class="status" id="status"></p>
        <p class="why" id="why"></p>
      </div>
      <dl class="cells">
        <div class="cell co2"><dt class="k"><svg class="qi qi-co2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><circle cx="3.9" cy="12" r="2.6"/><circle cx="20.1" cy="12" r="2.6"/><path d="M6.5 12h1.9M15.6 12h1.9"/></svg><span id="kCo2">CO₂</span></dt><dd><span class="v" id="vCo2">–</span><span class="u">ppm</span><span class="sr-only" id="uCo2"></span></dd></div>
        <div class="cell" id="cellTemp" data-lamp="off"><dt class="k"><svg class="qi qi-temp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg><span id="kTemp">Temperatur</span></dt><dd><span class="cdot" aria-hidden="true"></span><span class="v" id="vTemp">–</span><span class="u">°C</span><span class="sr-only" id="uTemp"></span></dd><dd class="dir" id="dTemp"></dd></div>
        <div class="cell" id="cellHum" data-lamp="off"><dt class="k"><svg class="qi qi-hum" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c3 3.7 6 7.2 6 10.5a6 6 0 0 1-12 0c0-3.3 3-6.8 6-10.5z"/></svg><span id="kHum">Luftfeuchte</span></dt><dd><span class="cdot" aria-hidden="true"></span><span class="v" id="vHum">–</span><span class="u">%</span><span class="sr-only" id="uHum"></span></dd><dd class="dir" id="dHum"></dd></div>
      </dl>
      <p class="fresh">
        <span class="dot" aria-hidden="true"></span>
        <svg class="warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" id="warnIcon" aria-label="Warnung"><path d="M12 3.5 2.5 20h19L12 3.5z"/><path d="M12 10v4.5"/><path d="M12 17.5h.01"/></svg>
        <span id="fresh"></span>
      </p>
    </div>
    <aside class="today" id="today" aria-labelledby="todayTitle">
      <h2 class="cap" id="todayTitle">Heute</h2>
      <p class="today-empty" id="todayEmpty" hidden></p>
      <dl class="today-list" id="todayList">
        <div class="pair"><dt id="kAbove">Über 1000 ppm</dt><dd><span class="v" id="vAbove">–</span></dd></div>
        <div class="pair"><dt id="kPeak">Höchstwert</dt><dd><span class="v" id="vPeak">–</span><span class="u" id="uPeak"></span></dd></div>
        <div class="pair"><dt><svg class="qi qi-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="1"/><path d="M12 3.5v17M4 12h16"/></svg><span id="kAired">Zuletzt gelüftet</span></dt><dd><span class="v" id="vAired">–</span><span class="est" id="airedNote"></span></dd></div>
      </dl>
    </aside>
  </section>

  <div class="charts" id="charts">
    <section class="panel panel-co2" id="panelCo2" aria-labelledby="hCo2">
      <h2><span class="h"><svg class="qi qi-co2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><circle cx="3.9" cy="12" r="2.6"/><circle cx="20.1" cy="12" r="2.6"/><path d="M6.5 12h1.9M15.6 12h1.9"/></svg><span id="hCo2">CO₂</span></span><span class="win" id="winCo2"></span></h2>
      <div class="chart" id="chartCo2" role="img"></div>
      <p class="note" id="noteCo2" hidden></p>
    </section>
    <section class="panel panel-temp" id="panelTemp" aria-labelledby="hTemp">
      <h2><span class="h"><svg class="qi qi-temp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg><span id="hTemp">Temperatur</span></span><span class="win" id="winTemp"></span></h2>
      <div class="chart" id="chartTemp" role="img"></div>
      <p class="note" id="noteTemp" hidden></p>
    </section>
    <section class="panel panel-hum" id="panelHum" aria-labelledby="hHum">
      <h2><span class="h"><svg class="qi qi-hum" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c3 3.7 6 7.2 6 10.5a6 6 0 0 1-12 0c0-3.3 3-6.8 6-10.5z"/></svg><span id="hHum">Luftfeuchte</span></span><span class="win" id="winHum"></span></h2>
      <div class="chart" id="chartHum" role="img"></div>
      <p class="note" id="noteHum" hidden></p>
    </section>
  </div>

  <section class="empty" id="empty">
    <h2 id="emptyTitle"></h2>
    <p id="emptyText"></p>
  </section>

  <section class="rooms" id="rooms" aria-labelledby="roomsTitle">
    <h2 id="roomsTitle">Räume mit Messwerten</h2>
    <p class="note" id="roomsNote" hidden></p>
    <p class="rooms-msg" id="roomsMsg" hidden></p>
    <div id="roomsBody"></div>
  </section>
</main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
