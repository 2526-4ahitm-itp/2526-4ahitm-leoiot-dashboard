esp32:
  board: esp32dev
  framework:
    type: arduino



logger:

ota:
  password: !secret ota_password
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  # The ESP32's Wi-Fi power saving (modem sleep) made the link lose about a fifth of all packets
  # with 35-200 ms delays, and the broker dropped the box every 30 s. The box is mains powered.
  power_save_mode: none
  ap:
    ssid: ${name}
    password: !secret ap_password

web_server:
  port: 80

mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_password
  client_id: "nili3_usb"
  discovery: false
  # A short stall must not end the session (the default is 15 s).
  keepalive: 60s
  # Only warnings and errors go to the broker; the debug log of every reading stays on the serial
  # port and the web server.
  log_topic:
    topic: nili3/debug
    level: WARN

captive_portal:

# esp32_ble_tracker:
# bluetooth_proxy:
#   active: true

button:
  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset


i2c:
  sda: 21
  scl: 22
  # scan: true
  id: bus_a

uart:
  rx_pin: GPIO13
  tx_pin: GPIO12
  baud_rate: 9600

sensor:
  - platform: wifi_signal
    name: ${name}_WiFi_Signal
    update_interval: 60s      

  - platform: bme280_i2c
    i2c_id: bus_a
    address: 0x76
    update_interval: 10s
    temperature:
      name: ${name}_Temperature
      id: temperature
      oversampling: 16x
      accuracy_decimals: 1
      filters:
        - lambda: return x-6;
    pressure:
      name: ${name}_Pressure
      id: pressure
    humidity:
      name: ${name}_Humidity
      id: humidity

  - platform: adc
    pin: GPIO32
    name: ${name}_Illuminance
    id: illuminance
    # unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    filters: 
      - lambda: return std::max(std::min( x * 100.0, 100.0), 0.0);
    on_value:
      then:
        - logger.log:
            format: "_Illuminance changed, value %.1f"
            args: [ 'id(illuminance).state' ]
        - lambda: |-
            float brightness_local = (id(illuminance).state) / 100.0f;
            if (brightness_local < 0.2f) {
              brightness_local = 0.2f;
            }
            id(brightness_neopixel) = brightness_local;
            ESP_LOGD("brightness neopixel", "Helligkeit der Neopixel gesetzt: %.1f", id(brightness_neopixel));              

  - platform: mhz19
    co2:
      name: ${name}_CO2
      id: co2

      on_value:
        then:
          - logger.log:
              format: "MHZ19 reports co2 value %.1f"
              args: [ 'id(co2).state' ]     

          - if:
              condition:
                lambda: |-
                  return id(co2).state < 800.0f;
              then:
                - logger.log: "CO2-Wert ist im niedrigen Bereich"
                - light.turn_on:
                    id: neopixel
                    brightness: !lambda return id(brightness_neopixel);
                      # lambda: |-   # Komplexe Lambda-Functions sind bei brightness nicht erlaubt
                        # return 0.2;
                        # float brightness_local = (id(illuminance).state) / 100.0f;
                        # if (brightness_local < 0.2f) {
                        #   brightness_local = 0.2f;
                        # }
                        # ESP_LOGD("low co2", "Neuer Helligkeitswert fuer LOW gesetzt: %.2f", brightness_local);              
                        # return brightness_local;
                    red: 0%
                    green: 100%
                    blue: 0%
          - if:
              condition:
                lambda: |-
                  return (id(co2).state >= 800.0f) && (id(co2).state <= 1000.0f);
              then:
                - logger.log: "CO2-Wert ist im mittleren Bereich"
                - light.turn_on:
                    id: neopixel
                    brightness: !lambda return id(brightness_neopixel);
                    red: 100%
                    green: 78%
                    blue: 0%
          - if:
              condition:
                lambda: |-
                  return id(co2).state > 1000.0f;
              then:
                - logger.log: "CO2-Wert ist im hohen Bereich"
                - light.turn_on:
                    id: neopixel
                    brightness: 100%
                    red: 100%
                    green: 0%
                    blue: 0%


# Variante 2 mit sensor.in_range funktioniert nicht mit variablen range-werten
          # - if:
          #     condition:
          #       sensor.in_range:
          #         id: co2
          #         below: 600
          #     then:
          #       - light.turn_on:
          #           id: neopixel
          #           brightness: !lambda return ((id(illuminance).state) / 200.0f);
