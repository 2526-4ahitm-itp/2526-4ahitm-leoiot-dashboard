    temperature:
      name: ${name}_MH-Z19 Temperature
      id: mhz19temperature
    update_interval: 10s
    automatic_baseline_calibration: false    

binary_sensor:
  - platform: gpio
    pin: 25
    name: ${name}_Motion
    id: motion
    device_class: motion

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO27
    num_leds: 1
    name: ${name}_NeoPixel
    id: neopixel
    on_turn_on:
      then:
          - logger.log:
              format: "Neopixel brightness value %.2f"
              args: [ 'id(neopixel).current_values.get_brightness()' ]        

    # on_turn_on:
    #   then:
    #     - light.turn_on:
    #         id: neopixel
    #         brightness: 30%
    #         red: 100%
    #         green: 0%
    #         blue: 0.0 

globals:
  - id: brightness_neopixel
    type: float
    restore_value: no
    initial_value: '0.3'
