<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeoIoT Energie – HTL Leonding</title>
</head>
<body>
<div class="page">
  <header class="top">
    <img id="logo" class="logo" alt="HTL Leonding">
    <div class="theme" role="group" aria-label="Design">
      <button type="button" id="themeLight" aria-pressed="true" aria-label="Helles Design"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" id="themeDark" aria-pressed="false" aria-label="Dunkles Design"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </div>
    <div class="time">
      <div id="clock" class="clock">--:--:--</div>
      <div class="updated"><span id="stale" class="stale" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 L22 20 H2 Z"/><path d="M12 10 V14"/><path d="M12 17 V17.2"/></svg> Daten veraltet</span> Zuletzt aktualisiert: <span id="updated">–</span></div>
    </div>
  </header>
  <main class="grid">
    <section class="field" data-state="loading" id="fieldToday" aria-labelledby="tToday"><div class="head"><h2 id="tToday">Heute</h2></div><div class="body"><div class="content" hidden></div><div class="state loading"><b>Daten werden geladen</b><span hidden></span></div></div></section>
    <section class="field" data-state="loading" id="fieldWeek" aria-labelledby="tWeek"><div class="head"><h2 id="tWeek">Wochenübersicht</h2><span class="lab" id="weekRange"></span></div><div class="body"><div class="content" hidden></div><div class="state loading"><b>Daten werden geladen</b><span hidden></span></div></div></section>
    <section class="field" data-state="loading" id="fieldPower" aria-labelledby="tPower"><div class="head"><h2 id="tPower">Leistung</h2><span class="lab">Heute</span></div><div class="body"><div class="content" hidden></div><div class="state loading"><b>Daten werden geladen</b><span hidden></span></div></div></section>
    <section class="field" data-state="loading" id="fieldFlow" aria-labelledby="tFlow"><div class="head"><h2 id="tFlow">Energiefluss</h2><span class="lab when-ok" id="flowSource"></span></div><div class="body"><div class="content" hidden></div><div class="state loading"><b>Daten werden geladen</b><span hidden></span></div></div></section>
    <div class="state page-state" id="pageState" role="status" hidden><b></b><span hidden></span></div>
  </main>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
