name: leoiot-pv

services:
  kiosk:
    # Kontext leoiot-pv/, damit shared/ mitkommt (kiosk/build-context sagt CI dasselbe)
    build:
      context: .
      dockerfile: kiosk/Dockerfile
    restart: unless-stopped
    ports:
      # Local only; the host nginx forwards /kiosk/ to this port.
      - "127.0.0.1:${KIOSK_PORT:-8088}:8088"
    environment:
      # Read-only InfluxDB token, injected by nginx; the browser never sees it.
      KIOSK_INFLUX_TOKEN: ${KIOSK_INFLUX_TOKEN:?KIOSK_INFLUX_TOKEN is not set; copy leoiot-pv/.env.example to leoiot-pv/.env and fill it in}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - platform

  dashboard:
    # Kontext leoiot-pv/, damit shared/ mitkommt (dashboard/build-context sagt CI dasselbe)
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    ports:
      # Local only; the host nginx forwards /pv/ to this port.
      - "127.0.0.1:${DASHBOARD_PORT:-8089}:8089"
    environment:
      # The kiosk's read-only InfluxDB token (design D5), injected by nginx; the browser never sees it.
      DASHBOARD_INFLUX_TOKEN: ${KIOSK_INFLUX_TOKEN:?KIOSK_INFLUX_TOKEN is not set; copy leoiot-pv/.env.example to leoiot-pv/.env and fill it in}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8089/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - platform

  collector:
    # Starts only on request: docker compose --profile collector up -d
    # The SolaX cloud keeps one session per account, so this service must never
    # run while another collector uses the same account.
    profiles: ["collector"]
    build: ./collector
    restart: unless-stopped
    environment:
      # SolaX login, plant, write token and broker login come from leoiot-pv/.env;
      # the collector itself exits and names a variable that is missing.
      COLLECTOR_SOLAX_CLIENT_ID: ${COLLECTOR_SOLAX_CLIENT_ID:-}
      COLLECTOR_SOLAX_CLIENT_SECRET: ${COLLECTOR_SOLAX_CLIENT_SECRET:-}
      COLLECTOR_SOLAX_USERNAME: ${COLLECTOR_SOLAX_USERNAME:-}
      COLLECTOR_SOLAX_PASSWORD: ${COLLECTOR_SOLAX_PASSWORD:-}
      COLLECTOR_SOLAX_PLANT_ID: ${COLLECTOR_SOLAX_PLANT_ID:-}
      COLLECTOR_INFLUX_TOKEN: ${COLLECTOR_INFLUX_TOKEN:-}
      COLLECTOR_MQTT_USER: ${COLLECTOR_MQTT_USER:-}
      COLLECTOR_MQTT_PASSWORD: ${COLLECTOR_MQTT_PASSWORD:-}
      # Production: the bucket server_data and publishing on. For a test create a
      # test bucket and set COLLECTOR_INFLUX_BUCKET=<test bucket> and
      # COLLECTOR_PUBLISH=0 in leoiot-pv/.env.
      COLLECTOR_INFLUX_BUCKET: ${COLLECTOR_INFLUX_BUCKET:-server_data}
      COLLECTOR_PUBLISH: ${COLLECTOR_PUBLISH:-1}
    healthcheck:
      # Unhealthy when the last delivered reading is older than five minutes.
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 2
    networks:
      - platform

networks:
  # InfluxDB and the MQTT WebSocket bridge still run in the previous stack,
  # so its network is joined as an external one. Their interfaces are
  # specified in platform/data-contract.
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-2526-4ahitm-leoiot-dashboard_leoiot}
