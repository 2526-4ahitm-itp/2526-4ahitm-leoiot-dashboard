<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeoIoT PV – HTL Leonding</title>
</head>
<body>
<header class="bar" id="bar"></header>
<main class="wrap" id="main" data-state="loading">
  <section class="lead" id="lead">
    <div id="leadText" aria-live="polite"></div>
    <p class="live" id="live"></p>
    <p class="lnote" id="status"></p>
  </section>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <section class="chartsec">
    <h2 class="sr" id="chartTitle"></h2>
    <div class="chartbox"><canvas id="chart" role="img"></canvas><div class="overlay" id="overlay" hidden></div></div>
    <ul class="legend" id="legend"></ul>
    <p class="chartnote" id="chartNote"></p>
    <button type="button" class="btn tbtn" id="tableBtn" aria-expanded="false" aria-controls="tableBox"></button>
    <div class="tablebox" id="tableBox" hidden></div>
  </section>
  <section class="figs" aria-labelledby="figTitle">
    <h2 id="figTitle"></h2>
    <p class="lnote figsnote" id="figNote"></p>
    <dl class="grid" id="figs"></dl>
    <dl class="ratios" id="ratios"></dl>
  </section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
