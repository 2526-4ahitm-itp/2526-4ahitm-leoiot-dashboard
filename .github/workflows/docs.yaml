name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Build reveal.js slides
        run: |
          curl -sL https://github.com/hakimel/reveal.js/archive/5.0.0.zip -o revealjs.zip
          unzip -q revealjs.zip
          mv reveal.js-5.0.0 asciidocs/slides/revealjs
          docker run --rm -v "$PWD/asciidocs/slides:/documents" asciidoctor/docker-asciidoctor:1.58 \
            asciidoctor-revealjs -r asciidoctor-diagram \
            -a revealjs_theme=league@ -a imagesdir=images@ -a revealjsdir=revealjs \
            -a revealjs_slideNumber=c/t@ -a revealjs_transition=slide@ -a revealjs_hash=true@ \
            -b revealjs leoiot.adoc
          mkdir -p dist/slides/revealjs
          cp asciidocs/slides/leoiot.html dist/slides/
          cp -r asciidocs/slides/css asciidocs/slides/images dist/slides/
          cp -r asciidocs/slides/revealjs/dist asciidocs/slides/revealjs/plugin dist/slides/revealjs/

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
