# Broker of all sub-projects (spec platform/broker). Topics and payloads are
# specified in platform/data-contract.

# Each listener has its own authentication and access rules, so that
# anonymous access exists on the WebSocket listener only.
per_listener_settings true

# Retained messages survive a restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout

# Devices and services: accounts only. pwfile and acl are host-local.
listener 1883
allow_anonymous false
password_file /mosquitto/config/pwfile
acl_file /mosquitto/config/acl

# Browsers, through nginx at /mqtt: anonymous and read-only on the
# room-climate topics (platform/data-contract).
listener 9001
protocol websockets
max_connections 500
allow_anonymous true
acl_file /mosquitto/config/acl-websocket
